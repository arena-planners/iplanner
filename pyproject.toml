[project]
name = "arena_planners_iplanner"
version = "0.0.0"
description = "iPlanner (imperative depth-image path planning) adapter for arena_planners bridge."
requires-python = ">=3.10"
dependencies = [
    "arena_planners",
    "torch>=2.14",
    "torchvision",
    "numpy",
    "pillow",
    "pyyaml",
]

[tool.uv.sources]
arena_planners = { git = "https://github.com/arena-planners/arena_planners.git", branch = "jazzy", subdirectory = "arena_planners" }

[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
line-length = 120
extend-exclude = ["iplanner_model"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["iplanner_model"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
